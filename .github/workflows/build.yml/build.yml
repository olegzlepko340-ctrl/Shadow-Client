
name: Build Shadow Client

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Extract project
        run: |
          unzip -q ShadowClient-Fabric-1.21.11.zip -d unpacked
          PROJECT_DIR=$(find unpacked -name settings.gradle -printf '%h\n' | head -n 1)
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

      - name: Build JAR
        run: gradle -p "$PROJECT_DIR" build

      - uses: actions/upload-artifact@v4
        with:
          name: Shadow-Client-JAR
          path: unpacked/**/build/libs/*.jar
